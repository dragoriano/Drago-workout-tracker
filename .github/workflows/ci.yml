name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production PWA build
        run: npm run build

      - name: Android web bundle & Capacitor sync
        run: npm run build:android

      - name: Verify Android web asset constraints
        run: |
          test ! -f android/app/src/main/assets/public/sw.js
          mp4_count=$(find android/app/src/main/assets/public -type f -name '*.mp4' | wc -l)
          test "$mp4_count" -eq 0
