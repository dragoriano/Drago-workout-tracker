<!doctype html>
<html lang="en">
  <head>
    <script>
      // Clear service workers in local web development to avoid asset interception errors
      const isNativeCapacitor = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
      const isLocalDevHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isNativeCapacitor && isLocalDevHost) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            if (registrations.length > 0) {
              Promise.all(registrations.map((r) => r.unregister())).then(() => {
                console.log('Cleared active service workers for development. Reloading page...');
                window.location.reload();
              });
            }
          });
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B0E13" />
    <meta name="description" content="Dragoriano Workout Tracker - Track your exercises, sets, reps, and progress with smart suggestions." />
    <meta property="og:title" content="Dragoriano Workout Tracker" />
    <meta property="og:description" content="Track your exercises, sets, reps, and progress with smart suggestions." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Dragoriano Workout Tracker</title>
  </head>
  <body class="bg-[#0B0E13] text-zinc-50 antialiased selection:bg-emerald-500/30">
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
